    /* ==========================================================
       SAFE STORAGE & AUDIO ENGINE (GOOGLE APPS SCRIPT SAFE)
       ========================================================== */
    function safeStorageGet(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : defaultVal;
      } catch (e) {
        return defaultVal;
      }
    }

    function safeStorageSet(key, val) {
      try {
        localStorage.setItem(key, val);
      } catch (e) {}
    }

    let audioCtx = null;
    let sfxEnabled = safeStorageGet('vc_sfx', 'true') === 'true';
    let bgmEnabled = safeStorageGet('vc_bgm', 'true') === 'true';
    let isMuted = false;
    let voicePitch = parseFloat(safeStorageGet('vc_pitch', '1.05')) || 1.05;
    let currentTheme = safeStorageGet('vc_theme', 'dark');

    // BGM Sequencer
    let bgmInterval = null;
    let isBgmPlaying = false;
    let bgmStep = 0;

    const BGM_MELODY = [
      261.63, 329.63, 392.00, 523.25,
      293.66, 369.99, 440.00, 587.33,
      329.63, 392.00, 493.88, 659.25,
      261.63, 392.00, 523.25, 659.25
    ];

    const BGM_BASS = [
      130.81, 130.81, 164.81, 174.61,
      146.83, 146.83, 174.61, 196.00,
      164.81, 164.81, 196.00, 220.00,
      130.81, 196.00, 130.81, 196.00
    ];

    function getAudioCtx() {
      try {
        if (!audioCtx) {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) audioCtx = new AudioCtxClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    // Auto unlock audio on any first user touch/click/key
    function unlockAudio() {
      const ctx = getAudioCtx();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    }
    ['click', 'touchstart', 'keydown'].forEach(ev => {
      window.addEventListener(ev, unlockAudio, { once: true, passive: true });
    });

    function playBgmNote(freq, type, gainVal, dur) {
      if (!bgmEnabled || isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur + 0.02);
      } catch (e) {}
    }

    function startBgm() {
      if (!bgmEnabled || isMuted || isBgmPlaying) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      isBgmPlaying = true;
      bgmStep = 0;
      if (bgmInterval) clearInterval(bgmInterval);
      bgmInterval = setInterval(() => {
        if (!bgmEnabled || isMuted || !isBgmPlaying) return;
        playBgmNote(BGM_MELODY[bgmStep % BGM_MELODY.length], 'triangle', 0.035, 0.2);
        if (bgmStep % 2 === 0) {
          playBgmNote(BGM_BASS[(bgmStep / 2) % BGM_BASS.length], 'sine', 0.06, 0.3);
        }
        bgmStep++;
      }, 260);
    }

    function stopBgm() {
      isBgmPlaying = false;
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function pauseBgm() {
      isBgmPlaying = false;
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function resumeBgm() {
      if (bgmEnabled && !isMuted) startBgm();
    }

    // SFX Synthesizer
    function playTick() {
      if (!sfxEnabled || isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    function playCorrect() {
      if (!sfxEnabled || isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.06);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.06);
          osc.stop(ctx.currentTime + i * 0.06 + 0.28);
        });
      } catch (e) {}
    }

    function playWrong() {
      if (!sfxEnabled || isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        [180, 130].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
          gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.12);
          osc.stop(ctx.currentTime + i * 0.12 + 0.22);
        });
      } catch (e) {}
    }

    function playFanfare() {
      if (!sfxEnabled || isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        [{ f: 523, t: 0 }, { f: 659, t: 0.15 }, { f: 784, t: 0.3 }, { f: 1046, t: 0.5 }].forEach(n => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.t);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + n.t);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.t + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + n.t);
          osc.stop(ctx.currentTime + n.t + 0.4);
        });
      } catch (e) {}
    }

    // Pronunciation (Non-Deep Natural Voice)
    let cachedVoices = [];
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      const loadVoices = () => {
        try { cachedVoices = window.speechSynthesis.getVoices(); } catch (e) {}
      };
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakEnglish(word) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.95;
        utter.pitch = voicePitch; // Adjustable (anti-deep)

        const voices = cachedVoices.length > 0 ? cachedVoices : window.speechSynthesis.getVoices();
        const pleasantVoice = voices.find(v => 
          v.lang.startsWith('en') && (
            v.name.includes('Natural') || 
            v.name.includes('Google US English') || 
            v.name.includes('Samantha') || 
            v.name.includes('Zira') || 
            v.name.includes('Jenny') ||
            v.name.includes('Ava')
          )
        ) || voices.find(v => v.lang.startsWith('en') && !v.name.includes('David')) || voices.find(v => v.lang.startsWith('en'));

        if (pleasantVoice) utter.voice = pleasantVoice;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function speakCurrentWord() {
      const q = STATE.questions[STATE.currentIndex];
      if (q && q.word) speakEnglish(q.word);
    }

    function speakWordByIndex(idx) {
      const q = STATE.questions[idx];
      if (q && q.word) speakEnglish(q.word);
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      safeStorageSet('vc_theme', currentTheme);
      applyThemeClasses();
      render();
    }

    function applyThemeClasses() {
      document.body.className = currentTheme === 'dark' 
        ? 'bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans overflow-x-hidden transition-colors'
        : 'bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between font-sans overflow-x-hidden transition-colors';
    }

    function shuffle10Questions(category) {
      let pool = [...QUESTION_BANK];
      if (category && category !== 'ALL') {
        const filtered = pool.filter(q => q.category === category);
        if (filtered.length >= 10) {
          pool = filtered;
        } else if (filtered.length > 0) {
          const others = pool.filter(q => q.category !== category);
          pool = [...filtered, ...others];
        }
      }
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, 10);
    }

    function startNewGame() {
      STATE.questions = shuffle10Questions(STATE.selectedCategory);
      STATE.currentIndex = 0;
      STATE.p1Score = 0;
      STATE.p2Score = 0;
      STATE.p1Streak = 0;
      STATE.p2Streak = 0;
      STATE.p1MaxStreak = 0;
      STATE.p2MaxStreak = 0;
      STATE.p1Correct = 0;
      STATE.p2Correct = 0;
      STATE.isPaused = false;
      STATE.isSettingsOpen = false;
      startCountdown();
    }

    function startCountdown() {
      STATE.phase = 'COUNTDOWN';
      render();
      let count = 3;
      playTick();
      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          playTick();
          const el = document.getElementById('countdown-num');
          if (el) el.innerText = count;
        } else {
          clearInterval(interval);
          const el = document.getElementById('countdown-num');
          if (el) el.innerText = 'START! ⚡';
          setTimeout(() => {
            startQuestion();
          }, 600);
        }
      }, 1000);
    }

    function startQuestion() {
      STATE.phase = 'PLAYING';
      STATE.isPaused = false;
      STATE.timer = 15;
      STATE.p1Answer = null;
      STATE.p2Answer = null;
      STATE.p1AnswerTimeMs = 0;
      STATE.p2AnswerTimeMs = 0;
      STATE.p1LastPts = 0;
      STATE.p2LastPts = 0;
      STATE.questionStartTime = Date.now();

      // Acak urutan tombol jawaban untuk Player 1 dan Player 2 (Anti-Contek!)
      function shuffle4() {
        const arr = [0, 1, 2, 3];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      STATE.p1Order = shuffle4();
      let o2 = shuffle4();
      let tries = 0;
      while (STATE.p1Order.every((v, i) => v === o2[i]) && tries < 20) {
        o2 = shuffle4();
        tries++;
      }
      STATE.p2Order = o2;

      startBgm();
      render();

      if (STATE.timerInterval) clearInterval(STATE.timerInterval);
      STATE.timerInterval = setInterval(() => {
        if (STATE.isPaused) return;
        STATE.timer--;
        if (STATE.timer <= 0) {
          clearInterval(STATE.timerInterval);
          triggerReveal();
        } else {
          if (STATE.timer <= 5) playTick();
          updateTimerUI();
        }
      }, 1000);
    }

    function handleAnswer(playerNum, optionIndex) {
      if (STATE.phase !== 'PLAYING' || STATE.isPaused) return;
      const elapsed = Date.now() - STATE.questionStartTime;
      
      if (playerNum === 1 && STATE.p1Answer === null) {
        STATE.p1Answer = optionIndex;
        STATE.p1AnswerTimeMs = elapsed;
        renderPlayingArena();
      } else if (playerNum === 2 && STATE.p2Answer === null) {
        STATE.p2Answer = optionIndex;
        STATE.p2AnswerTimeMs = elapsed;
        renderPlayingArena();
      }

      if (STATE.p1Answer !== null && STATE.p2Answer !== null) {
        setTimeout(() => {
          triggerReveal();
        }, 300);
      }
    }

    function calcPoints(isCorrect, timeMs, streak) {
      if (!isCorrect) return 0;
      const base = 1000;
      const speed = Math.max(0, Math.round(((15000 - timeMs) / 15000) * 500));
      const bonus = streak >= 3 ? 300 : streak === 2 ? 200 : streak === 1 ? 100 : 0;
      return base + speed + bonus;
    }

    function triggerReveal() {
      if (STATE.timerInterval) clearInterval(STATE.timerInterval);
      STATE.phase = 'REVEAL';
      const q = STATE.questions[STATE.currentIndex];

      const p1Correct = STATE.p1Answer === q.correctIndex;
      const p2Correct = STATE.p2Answer === q.correctIndex;

      if (p1Correct) {
        STATE.p1Correct++;
        STATE.p1Streak++;
        STATE.p1MaxStreak = Math.max(STATE.p1MaxStreak, STATE.p1Streak);
        STATE.p1LastPts = calcPoints(true, STATE.p1AnswerTimeMs, STATE.p1Streak);
        STATE.p1Score += STATE.p1LastPts;
      } else {
        STATE.p1Streak = 0;
        STATE.p1LastPts = 0;
      }

      if (p2Correct) {
        STATE.p2Correct++;
        STATE.p2Streak++;
        STATE.p2MaxStreak = Math.max(STATE.p2MaxStreak, STATE.p2Streak);
        STATE.p2LastPts = calcPoints(true, STATE.p2AnswerTimeMs, STATE.p2Streak);
        STATE.p2Score += STATE.p2LastPts;
      } else {
        STATE.p2Streak = 0;
        STATE.p2LastPts = 0;
      }

      if (p1Correct || p2Correct) playCorrect();
      else playWrong();

      STATE.revealTimer = 4;
      render();

      if (STATE.revealInterval) clearInterval(STATE.revealInterval);
      STATE.revealInterval = setInterval(() => {
        if (STATE.isPaused) return;
        STATE.revealTimer--;
        const el = document.getElementById('reveal-countdown');
        if (el) el.innerText = STATE.revealTimer + 's';
        if (STATE.revealTimer <= 0) {
          clearInterval(STATE.revealInterval);
          nextQuestion();
        }
      }, 1000);
    }

    function nextQuestion() {
      if (STATE.revealInterval) clearInterval(STATE.revealInterval);
      if (STATE.currentIndex < 9 && STATE.currentIndex < STATE.questions.length - 1) {
        STATE.currentIndex++;
        startQuestion();
      } else {
        STATE.phase = 'GAMEOVER';
        stopBgm();
        playFanfare();
        render();
      }
    }

    // Pause Handlers
    function togglePause() {
      STATE.isPaused = !STATE.isPaused;
      if (STATE.isPaused) {
        pauseBgm();
      } else {
        resumeBgm();
      }
      render();
    }

    function restartCurrentQuestion() {
      STATE.isPaused = false;
      startQuestion();
    }

    function returnToMainMenu() {
      if (STATE.timerInterval) clearInterval(STATE.timerInterval);
      if (STATE.revealInterval) clearInterval(STATE.revealInterval);
      stopBgm();
      STATE.isPaused = false;
      STATE.isSettingsOpen = false;
      STATE.phase = 'TITLE';
      render();
    }

    function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {

    /* Keyboard listener (Ignored when typing in inputs) */
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
        return;
      }
      if (STATE.phase !== 'PLAYING' || STATE.isPaused) return;
      const key = e.key.toLowerCase();
      // P1: A, S, D, F
      if (key === 'a') handleAnswer(1, 0);
      else if (key === 's') handleAnswer(1, 1);
      else if (key === 'd') handleAnswer(1, 2);
      else if (key === 'f') handleAnswer(1, 3);
      // P2: H, J, K, L or 1, 2, 3, 4
      else if (key === 'h' || key === '1') handleAnswer(2, 0);
      else if (key === 'j' || key === '2') handleAnswer(2, 1);
      else if (key === 'k' || key === '3') handleAnswer(2, 2);

        }

                <div class="grid grid-cols-4 gap-1.5">
                  <button onclick="voicePitch = 0.95; safeStorageSet('vc_pitch', '0.95'); speakEnglish('Table'); render();" class="py-1 px-1 rounded-xl text-xs font-bold border cursor-pointer btn-touch ${voicePitch <= 0.98 ? 'bg-indigo-600 text-white border-indigo-500' : isLight ? 'bg-slate-100 text-slate-800 border-slate-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">0.95</button>
                  <button onclick="voicePitch = 1.05; safeStorageSet('vc_pitch', '1.05'); speakEnglish('Table'); render();" class="py-1 px-1 rounded-xl text-xs font-bold border cursor-pointer btn-touch ${voicePitch > 0.98 && voicePitch <= 1.08 ? 'bg-indigo-600 text-white border-indigo-500' : isLight ? 'bg-slate-100 text-slate-800 border-slate-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">1.05 ★</button>
                  <button onclick="voicePitch = 1.15; safeStorageSet('vc_pitch', '1.15'); speakEnglish('Table'); render();" class="py-1 px-1 rounded-xl text-xs font-bold border cursor-pointer btn-touch ${voicePitch > 1.08 && voicePitch < 1.22 ? 'bg-indigo-600 text-white border-indigo-500' : isLight ? 'bg-slate-100 text-slate-800 border-slate-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">1.15</button>
                  <button onclick="voicePitch = 1.25; safeStorageSet('vc_pitch', '1.25'); speakEnglish('Table'); render();" class="py-1 px-1 rounded-xl text-xs font-bold border cursor-pointer btn-touch ${voicePitch >= 1.22 ? 'bg-indigo-600 text-white border-indigo-500' : isLight ? 'bg-slate-100 text-slate-800 border-slate-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">1.25</button>
                </div>
              </div>
            </div>
            <div class="mt-5 pt-3 border-t ${isLight ? 'border-slate-200' : 'border-slate-800'} flex justify-end">
              <button onclick="closeSettings()" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm cursor-pointer shadow btn-touch">
                Tutup & Simpan
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // INITIAL RENDER
    render();
  </script>
</body>
</html>
